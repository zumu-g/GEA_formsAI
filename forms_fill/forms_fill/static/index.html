<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GEA — VCAT/RTA Notice Fill</title>
<style>
  :root {
    --ink: #1A1814;
    --paper: #FAF8F4;
    --surface: #F2EEE8;
    --rule: #E0DBD4;
    --muted: #8B8580;
    --gold: #C8A96E;
    --gold-soft: #E8D4A8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #F0EDE8; --paper: #141210; --surface: #1C1A17; --rule: #2A2825; --muted: #6B6560; }
  }
  :root[data-theme="dark"] { --ink: #F0EDE8; --paper: #141210; --surface: #1C1A17; --rule: #2A2825; --muted: #6B6560; }
  :root[data-theme="light"] { --ink: #1A1814; --paper: #FAF8F4; --surface: #F2EEE8; --rule: #E0DBD4; --muted: #8B8580; }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.25rem 4rem;
    background: var(--paper); color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); margin: 0 0 2rem; font-size: 0.9rem; }
  fieldset { border: 1px solid var(--rule); border-radius: 10px; padding: 1.25rem; margin: 0 0 1.25rem; background: var(--surface); }
  legend { padding: 0 0.5rem; font-weight: 600; font-size: 0.9rem; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.75rem 0 0.25rem; }
  label:first-of-type { margin-top: 0; }
  input, select, textarea {
    width: 100%; padding: 0.55rem 0.65rem; border: 1px solid var(--rule); border-radius: 6px;
    background: var(--paper); color: var(--ink); font: inherit; min-height: 44px;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  button {
    min-height: 44px; padding: 0.6rem 1.4rem; border: none; border-radius: 6px;
    background: var(--gold); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; border: 1px solid var(--rule); font-weight: 500; }
  .row { display: flex; gap: 0.75rem; }
  .row > * { flex: 1; }
  #result { margin-top: 1.5rem; padding: 1rem 1.25rem; border-radius: 10px; border: 1px solid var(--rule); }
  #result.ok { border-color: var(--gold-soft); }
  #result.err { border-color: #b3564a; }
  #result a { color: inherit; font-weight: 600; }
  .warn { color: #b3564a; font-size: 0.85rem; margin-top: 0.5rem; }
  .hint { color: var(--muted); font-size: 0.8rem; margin-top: 0.35rem; }
  #token-banner { display: none; margin-bottom: 1.5rem; }
  #token-banner.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>VCAT / RTA Notice Fill</h1>
  <p class="subtitle">Fill a Consumer Affairs Victoria notice for review — never lodges to VCAT Online.</p>

  <fieldset id="token-banner">
    <legend>API token</legend>
    <label for="token">Bearer token</label>
    <input id="token" type="password" placeholder="Paste the forms-fill bearer token" />
    <p class="hint">Stored only in this browser tab (sessionStorage).</p>
  </fieldset>

  <form id="fill-form">
    <fieldset>
      <legend>1. Notice</legend>
      <label for="form-key">Notice type</label>
      <select id="form-key" required></select>
    </fieldset>

    <fieldset>
      <legend>2. Tenancy</legend>
      <div class="row">
        <div>
          <label for="provider">Data source</label>
          <select id="provider">
            <option value="propertyme">PropertyMe</option>
            <option value="gea_crm">GEA CRM</option>
            <option value="fixture">Fixture (test data)</option>
          </select>
        </div>
        <div>
          <label for="lot-id">Lot ID</label>
          <input id="lot-id" placeholder="e.g. L-2002" />
        </div>
        <div>
          <label for="tenancy-id">Tenancy ID (preferred)</label>
          <input id="tenancy-id" placeholder="e.g. T-1001" />
        </div>
      </div>
    </fieldset>

    <fieldset id="caller-fields">
      <legend>3. Notice details</legend>
      <p class="hint">Rendered verbatim — this tool never computes dates, notice periods, or legal grounds.</p>
      <div id="caller-fields-inputs"></div>
    </fieldset>

    <button type="submit" id="submit-btn">Fill notice</button>
  </form>

  <div id="result" style="display:none"></div>
</div>

<script>
(function () {
  const API = ''; // same-origin
  const tokenInput = document.getElementById('token');
  const tokenBanner = document.getElementById('token-banner');
  const formSelect = document.getElementById('form-key');
  const callerFieldsBox = document.getElementById('caller-fields-inputs');
  const resultBox = document.getElementById('result');
  const form = document.getElementById('fill-form');
  const submitBtn = document.getElementById('submit-btn');

  let catalogue = [];

  function getToken() {
    return sessionStorage.getItem('forms_fill_token') || '';
  }
  function setToken(v) {
    sessionStorage.setItem('forms_fill_token', v);
  }

  function authHeaders() {
    return { Authorization: 'Bearer ' + getToken() };
  }

  function showResult(html, ok) {
    resultBox.style.display = 'block';
    resultBox.className = ok ? 'ok' : 'err';
    resultBox.innerHTML = html;
  }

  function renderCallerFields(spec) {
    callerFieldsBox.innerHTML = '';
    (spec.caller_fields || []).forEach((f) => {
      const label = document.createElement('label');
      label.textContent = f.label;
      label.setAttribute('for', 'cf-' + f.name);
      const long = f.name.includes('details') || f.name.includes('reason') || f.name.includes('damage') || f.name.includes('action');
      const input = document.createElement(long ? 'textarea' : 'input');
      input.id = 'cf-' + f.name;
      input.dataset.field = f.name;
      callerFieldsBox.appendChild(label);
      callerFieldsBox.appendChild(input);
    });
  }

  async function loadForms() {
    const token = getToken();
    if (!token) {
      tokenBanner.classList.add('show');
      return;
    }
    try {
      const resp = await fetch(API + '/forms', { headers: authHeaders() });
      if (resp.status === 401) {
        tokenBanner.classList.add('show');
        return;
      }
      const body = await resp.json();
      catalogue = body.forms || [];
      formSelect.innerHTML = '';
      const groups = {};
      catalogue.forEach((f) => {
        groups[f.group] = groups[f.group] || [];
        groups[f.group].push(f);
      });
      Object.keys(groups).sort().forEach((g) => {
        const optgroup = document.createElement('optgroup');
        optgroup.label = g;
        groups[g].forEach((f) => {
          const opt = document.createElement('option');
          opt.value = f.key;
          opt.textContent = f.title;
          optgroup.appendChild(opt);
        });
        formSelect.appendChild(optgroup);
      });
      if (catalogue.length) {
        renderCallerFields(catalogue[0]);
      }
    } catch (e) {
      showResult('Could not reach the forms-fill API: ' + e, false);
    }
  }

  formSelect.addEventListener('change', () => {
    const spec = catalogue.find((f) => f.key === formSelect.value);
    if (spec) renderCallerFields(spec);
  });

  tokenInput.addEventListener('change', () => {
    setToken(tokenInput.value.trim());
    loadForms();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    resultBox.style.display = 'none';
    try {
      const fields = {};
      callerFieldsBox.querySelectorAll('[data-field]').forEach((el) => {
        if (el.value) fields[el.dataset.field] = el.value;
      });
      const payload = {
        form: formSelect.value,
        provider: document.getElementById('provider').value,
        identifiers: {
          lot_id: document.getElementById('lot-id').value || undefined,
          tenancy_id: document.getElementById('tenancy-id').value || undefined,
        },
        fields: fields,
      };
      const resp = await fetch(API + '/fill', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
        body: JSON.stringify(payload),
      });
      const body = await resp.json();
      if (!resp.ok || body.ok === false) {
        showResult('Fill failed: ' + (body.message || body.error || resp.status), false);
        return;
      }
      let html = '<strong>Filled — review before serving/lodging.</strong><br>';
      if (body.files.pdf) html += '<a href="' + body.files.pdf + '" target="_blank">Download PDF</a> · ';
      if (body.files.docx) html += '<a href="' + body.files.docx + '" target="_blank">Download DOCX</a>';
      if (body.blank_fields && body.blank_fields.length) {
        html += '<div class="warn">Blank fields (no data found): ' + body.blank_fields.join(', ') + '</div>';
      }
      if (body.warnings && body.warnings.length) {
        html += '<div class="warn">' + body.warnings.join('<br>') + '</div>';
      }
      showResult(html, true);
    } catch (err) {
      showResult('Request failed: ' + err, false);
    } finally {
      submitBtn.disabled = false;
    }
  });

  tokenInput.value = getToken();
  loadForms();
})();
</script>
</body>
</html>
