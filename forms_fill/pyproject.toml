[project]
name = "gea-forms-fill"
version = "0.1.0"
description = "Headless form-fill tool: fill known legal templates from caller fields + fetched property data."
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "pydantic>=2.6",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
forms = "forms_fill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forms_fill*"]

[tool.setuptools.package-data]
forms_fill = ["forms/**/*.docx", "forms/**/*.pdf", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
